services:
  broker:
    build:
      context: ../..
      dockerfile: deployment/broker/Dockerfile
    restart: unless-stopped
    volumes:
      - broker-data:/var/lib/relay-broker
    # Deliberately no host port: Caddy is the only public entrypoint.

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - broker
    environment:
      RELAY_PUBLIC_DOMAIN: ${RELAY_PUBLIC_DOMAIN:?Set a public DNS name before starting}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  broker-data:
  caddy-data:
  caddy-config:
